<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>높이 측정기</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --ink: #172033;
            --muted: #718096;
            --line: #e5eaf2;
            --surface: #ffffff;
            --soft: #f5f7fb;
        }

        html {
            min-height: 100%;
            background: #f3f5f9;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            color: var(--ink);
            background: linear-gradient(
                180deg,
                #f8faff 0%,
                #edf1f8 100%
            );
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 470px;
            padding: 28px;
            background: var(--surface);
            border: 1px solid rgba(226, 232, 240, .9);
            border-radius: 28px;
            box-shadow: 0 18px 55px rgba(31, 49, 82, .10);
        }

        h1 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 27px;
            line-height: 1.25;
            letter-spacing: -.7px;
            font-weight: 750;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            margin-bottom: 12px;
            color: #303b50;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.2px;
        }

        .unit-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .unit-btn {
            flex: 1;
            min-height: 46px;
            padding: 11px 10px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #f8faff;
            color: #596579;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            transition:
                background .18s ease,
                border-color .18s ease,
                color .18s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        .unit-btn.active {
            border-color: var(--accent);
            background: #eaf1ff;
            color: var(--accent-dark);
            box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .08);
        }

        .unit-btn:hover {
            border-color: #9bb9fa;
        }

        .status-box,
        .sensor-status {
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--soft);
            text-align: center;
        }

        .status-box {
            padding: 16px;
            margin-bottom: 16px;
        }

        .status-label {
            margin-bottom: 6px;
            color: #8792a5;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .status-text {
            color: #46536a;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .result-box {
            margin-bottom: 16px;
            padding: 23px 18px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                #2563eb 0%,
                #4f46e5 100%
            );
            color: white;
            text-align: center;
            box-shadow: 0 10px 24px rgba(37, 99, 235, .18);
        }

        .result-label {
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            opacity: .84;
        }

        .result-value {
            font-size: 38px;
            font-weight: 750;
            line-height: 1.2;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            flex: 1;
            min-height: 48px;
            padding: 13px 14px;
            border: 1px solid transparent;
            border-radius: 15px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform .15s ease,
                background .15s ease,
                box-shadow .15s ease;
            -webkit-user-select: none;
            user-select: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn:active:not(:disabled) {
            transform: scale(.98);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 5px 13px rgba(37, 99, 235, .17);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .btn-primary:disabled {
            background: #cbd3e1;
            box-shadow: none;
            cursor: not-allowed;
            opacity: .8;
        }

        .btn-secondary {
            border-color: var(--line);
            background: #f5f7fb;
            color: #445066;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #eaf0f8;
        }

        .btn-secondary:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .info-box,
        .warning-box,
        .error-box {
            margin-bottom: 18px;
            padding: 14px 15px;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.65;
        }

        .info-box {
            border-color: #dbeafe;
            background: #f0f6ff;
            color: #315a9d;
        }

        .warning-box {
            border-color: #f8e5b2;
            background: #fff9e9;
            color: #87621b;
        }

        .error-box {
            border-color: #f5d0d4;
            background: #fff2f3;
            color: #9d3541;
        }

        .calibration-input-group {
            display: flex;
            gap: 9px;
            margin-bottom: 12px;
        }

        .calibration-input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid #dce3ee;
            border-radius: 14px;
            background: #fbfcff;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            -webkit-appearance: none;
            appearance: none;
        }

        .calibration-input:focus {
            outline: none;
            border-color: #8bb0ff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .10);
        }

        .unit-display {
            min-width: 62px;
            padding: 13px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #f3f6fb;
            color: #46536a;
            text-align: center;
            font-weight: 700;
        }

        .calibration-hint {
            margin-bottom: 14px;
            color: #8994a6;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .sensor-status {
            margin-bottom: 18px;
            padding: 10px 12px;
            color: #657187;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .sensor-status.ok {
            border-color: #c6ead5;
            background: #effaf3;
            color: #247446;
        }

        .sensor-status.error {
            border-color: #f3c9ce;
            background: #fff1f2;
            color: #a43240;
        }

        .sensor-status.waiting {
            border-color: #d7e5ff;
            background: #f0f6ff;
            color: #315a9d;
        }

        .footer {
            margin-top: 18px;
            color: #98a2b3;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-y: auto;
            background: rgba(17, 27, 47, .42);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 410px;
            max-height: 90vh;
            margin: auto;
            padding: 25px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(14, 25, 47, .22);
            text-align: center;
        }

        .modal-title {
            margin-bottom: 14px;
            color: var(--ink);
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -.3px;
        }

        .modal-text {
            margin-bottom: 18px;
            color: #596579;
            font-size: 14px;
            line-height: 1.7;
            text-align: left;
        }

        .modal-buttons {
            display: flex;
            gap: 9px;
        }

        .modal-buttons .btn {
            flex: 1;
        }

        .step-guide {
            margin: 13px 0;
            padding: 15px;
            border: 1px solid #edf0f6;
            border-radius: 15px;
            background: #f8faff;
            text-align: left;
        }

        .step-item {
            margin-bottom: 12px;
            color: #566176;
            font-size: 13px;
            line-height: 1.65;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-item strong {
            display: block;
            margin-bottom: 3px;
            color: #315fbd;
        }

        .step-item code {
            padding: 2px 6px;
            border-radius: 6px;
            background: #e8efff;
            color: #2856aa;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .sensor-data {
            margin: 12px 0;
            padding: 13px;
            border: 1px solid #e9eef6;
            border-radius: 14px;
            background: #f7f9fd;
            color: #445066;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            text-align: left;
        }

        .sensor-value {
            margin: 4px 0;
        }

        button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .3);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 14px 11px;
            }

            .container {
                padding: 22px 18px;
                border-radius: 24px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 22px;
            }

            .result-value {
                font-size: 33px;
            }

            .btn {
                min-height: 46px;
                padding: 12px 9px;
                font-size: 13px;
            }

            .modal {
                padding: 12px;
            }

            .modal-content {
                padding: 20px 17px;
                border-radius: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>
