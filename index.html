<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 좌표 기반 높이 측정기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #a0aec0; }
        .metric {
            font-size: 42px;
            font-weight: bold;
            color: #48bb78;
            margin: 10px 0;
        }
        .info {
            font-size: 13px;
            color: #cbd5e0;
            margin-bottom: 15px;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:active { background-color: #2b6cb0; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2>공간 좌표 높이 측정</h2>
        <div class="info" id="status">AR 기능을 지원하는 브라우저에서 실행해주세요.</div>
        <div>높이 변화 (Y 좌표)</div>
        <div class="metric" id="heightDisplay">0.00 cm</div>
        <button id="startAR" onclick="startARSession()">AR 측정 시작</button>
    </div>

    <!-- Three.js 및 WebXR 라이브러리 로드 -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

        let container;
        let camera, scene, renderer;
        let startY = null;
        let isTracking = false;

        const heightDisplay = document.getElementById('heightDisplay');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startAR');

        window.startARSession = function() {
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        initAR();
                    } else {
                        alert('이 기기 또는 브라우저는 WebXR AR을 지원하지 않습니다. (Chrome 또는 Safari 최신 버전 필요)');
                    }
                });
            } else {
                alert('WebXR을 지원하지 않는 브라우저입니다.');
            }
        };

        function initAR() {
            startBtn.style.display = 'none';
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // AR 세션 시작 옵션 (viewer 공간 추적)
            let currentSession = null;
            
            navigator.xr.requestSession('immersive-ar', { 
                requiredFeatures: ['local'] 
            }).then((session) => {
                currentSession = session;
                renderer.xr.setSession(session);
                statusDiv.textContent = '측정 중: 핸드폰을 위아래로 움직여보세요.';
                isTracking = true;

                session.addEventListener('end', () => {
                    isTracking = false;
                    startBtn.style.display = 'block';
                    statusDiv.textContent = '세션이 종료되었습니다.';
                });

                renderer.setAnimationLoop(render);
            });
        }

        function render(timestamp, frame) {
            if (frame && isTracking) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();
                
                // 카메라(핸드폰)의 현재 공간 Pose 가져오기
                const pose = frame.getViewerPose(referenceSpace);
                
                if (pose) {
                    const currentY = pose.transform.position.y; // 미터 단위 Y 좌표

                    if (startY === null) {
                        startY = currentY; // 첫 시작 지점을 기준점(0)으로 설정
                    }

                    // 기준점으로부터의 높이 변동 계산 (미터 -> 센티미터)
                    const diffY = (currentY - startY) * 100;

                    heightDisplay.textContent = diffY.toFixed(2) + ' cm';
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
